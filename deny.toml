# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Each entry must still be reported by `cargo deny check advisories`; an
# ignore whose advisory is no longer detected hides the next real finding
# on that crate and is pruned.
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error — unmaintained (used by gtk-rs)
    "RUSTSEC-2026-0009", # time — stack exhaustion in RFC 2822 parsing; only reachable via mac-notification-sys (macOS), not a target platform
    "RUSTSEC-2026-0194", # quick-xml 0.37 quadratic duplicate-attr check (DoS): sole remaining path is tauri-winrt-notification 0.7 (notify-rust), which generates toast XML from app strings and parses no untrusted XML. Fix needs quick-xml >=0.41; no notify-rust release adopts it yet. The wayland-scanner path was fixed by lockfile bump to 0.41.
    "RUSTSEC-2026-0195", # quick-xml 0.37 NsReader unbounded allocation (DoS): same single path, same fix status as RUSTSEC-2026-0194
]

[licenses]
# Allow list derived from `cargo deny list` over the full dependency tree.
# Newer cargo-deny rejects every license that is not explicitly allowed, so
# an absent [licenses] section fails CI outright.
#
# Notes:
# - MPL-2.0: symphonia (rodio's WAV decoder) and option-ext; file-level
#   copyleft, satisfied by using the crates unmodified.
# - OFL-1.1 / Ubuntu-font-1.0: epaint_default_fonts (egui's embedded fonts).
# - LGPL-2.1-or-later is NOT allowed: its only source (r-efi) is
#   `MIT OR Apache-2.0 OR LGPL-2.1-or-later`, satisfied via MIT.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
